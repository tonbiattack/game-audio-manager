name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish self-contained executable
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test tests/GameAudioManager.Core.Tests/GameAudioManager.Core.Tests.csproj `
            --configuration Release --logger "console;verbosity=normal"

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish win-x64
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.value }} -Runtime win-x64

      - name: Zip the artifact
        shell: pwsh
        run: |
          $name = "game-audio-manager-${{ steps.version.outputs.value }}-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $name
          "artifact=$name" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.artifact }}
          generate_release_notes: true
          body: |
            ## インストール

            1. 下の ZIP をダウンロードして展開します
            2. `GameAudioManager.exe` を実行します

            .NET ランタイムのインストールは不要です（自己完結）。

            ## 注意

            - コード署名を行っていないため、初回起動時に SmartScreen の警告が出る場合があります。
              「詳細情報」→「実行」で起動できます
            - 設定は `%LOCALAPPDATA%\GameAudioManager\settings.json` に保存されます

            ## 移行

            旧 PowerShell 版の `config/games.json` はそのまま残ります。本アプリの設定とは別ファイルです。
            既存の自動起動ショートカット（`Install-GameAudioManagerStartup.ps1`）を使っている場合は、
            本アプリの「ログオン時に自動起動」に切り替えてから削除してください。
