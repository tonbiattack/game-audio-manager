name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish the executable and the Store package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test tests/GameAudioManager.Core.Tests/GameAudioManager.Core.Tests.csproj `
            --configuration Release --logger "console;verbosity=normal"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # Tags look like v2.0.0. A manual run has no tag, so fall back to a
          # development version that still satisfies the four-part MSIX rule.
          if ('${{ github.ref }}' -like 'refs/tags/*') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          else {
            $version = '0.1.0'
          }

          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.1.0' }

          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $packageVersion = ($parts[0..3] -join '.')

          "app=$version" >> $env:GITHUB_OUTPUT
          "package=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $version"
          Write-Host "Package version: $packageVersion"

      - name: Publish win-x64
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.app }} -Runtime win-x64

      - name: Zip the artifact
        id: zip
        shell: pwsh
        run: |
          $name = "game-audio-manager-${{ steps.version.outputs.app }}-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $name
          "artifact=$name" >> $env:GITHUB_OUTPUT

      - name: Pack the MSIX for the Store
        id: msix
        shell: pwsh
        run: |
          ./scripts/pack-msix.ps1 -Version ${{ steps.version.outputs.package }}
          if (-not (Test-Path -LiteralPath 'artifacts/GameAudioManager.msix')) {
            throw 'The MSIX package was not produced.'
          }

          $name = "game-audio-manager-${{ steps.version.outputs.package }}-win-x64.msix"
          Copy-Item -LiteralPath 'artifacts/GameAudioManager.msix' -Destination $name
          $size = [math]::Round((Get-Item -LiteralPath $name).Length / 1MB, 1)
          Write-Host "MSIX: $name ($size MB, version ${{ steps.version.outputs.package }})"
          "artifact=$name" >> $env:GITHUB_OUTPUT

      # The Store package is unsigned: the Store re-signs it during ingestion and
      # an unsigned package cannot be side-loaded without administrator rights, so
      # it is published as a workflow artifact rather than a release download.
      - name: Upload the Store package
        uses: actions/upload-artifact@v7
        with:
          name: store-msix
          path: ${{ steps.msix.outputs.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.zip.outputs.artifact }}
          generate_release_notes: true
          body: |
            ## インストール

            1. 下の ZIP をダウンロードして展開します
            2. `GameAudioManager.exe` を実行します

            .NET ランタイムのインストールは不要です（自己完結）。

            Microsoft Store 版（MSIX）も同じ機能を提供します。ストアからのインストールをお待ちください。

            ## 注意

            - コード署名を行っていないため、初回起動時に SmartScreen の警告が出る場合があります。
              「詳細情報」→「実行」で起動できます
            - 設定は `%LOCALAPPDATA%\GameAudioManager\settings.json` に保存されます
            - ストア版と同時に起動しないでください（同じアプリの出力先を奪い合います）

            ## 移行

            旧 PowerShell 版の `config/games.json` はそのまま残ります。本アプリの設定とは別ファイルです。
            既存の自動起動ショートカット（`Install-GameAudioManagerStartup.ps1`）を使っている場合は、
            本アプリの「ログオン時に自動起動」に切り替えてから削除してください。
